name: Prepare site candidate
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.impeccable/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Build once with its source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/build.py --source-commit "$SOURCE_COMMIT"
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/verify.py
      - name: Package the tested candidate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/release_bundle.py pack --source "$SOURCE_COMMIT" --output output/candidate
      - uses: actions/upload-artifact@v7
        with:
          name: site-candidate
          path: output/candidate/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - run: python scripts/release_workflow.py summary --folder output/candidate
